<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Title</title>
    <style>
         body {
             font-family: Arial, sans-serif;
             background-image: url("/static/images/download (8).jpg");
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;
             background-attachment: fixed;
             min-height: 100vh;
             margin: 0;
             padding: 20px;
             width: 100%;
             height: 100%;
         }
         .form
         {
             margin-top: 200px;
         }
.search{
    display: flex;
    justify-content: center;
    margin-bottom: 100px;


}
         .search-bar
         {

            width: 510px;
{#             opacity: 10%;#}
             border: #591160;




         }
         .search-bar input
         {
             margin-top: 300px;
             width:550px;
             height: 50px;
                border-radius: 300px;
             background: rgba(251,255,254,0.09);
             border: none;
{#             margin-left: 60px;#}
             color: white;


         }
         .search-bar input::placeholder{
             color: white;
             opacity: 100%;

         }

         .search-icon{
             width: 30px;
             margin-top: 300px;


         }
         .search-icon p
         {
             color: white;

         }
         .search-icon button
         {

             background: transparent;
             outline: none;
         }
         button {
    border: 1px solid transparent;
}

button:hover,
button:focus,
button:active {
    border: 1px solid transparent;
}

.search-input {
    border: none;
}







        .movie-card {
        width: 200px;
        text-align: center;
    }

    .movie-card h2 {
        font-size: 16px;
        margin: 8px 0 4px;
        color: white;
    }

    .movie-card p {
        font-size: 13px;
        color: white;
        margin: 0;
    }

    .movie-card img {
        border-radius: 8px;
    }
          .results-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }
    </style>

</head>
<body>
<form method="get"><div class="search"> <div class="search-bar"><input type="text" name="q" placeholder="Search..."></div>
        <div class="search-icon">
            <button type="submit"> <p>


                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search text-white"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>

            </p></button></div>
   </div>
</form>



{% if movies %}
    <div class="results-container">
        {% for movie in movies %}

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}" width="200" height="300">
                <h2>{{ movie.title }}</h2>
                <p>{{ movie.release_date |slice:":4"}}</p>
            </div>
        {% endfor %}
    </div>

{% endif %}

</body>
</html>
